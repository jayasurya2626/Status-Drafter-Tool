<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Admin Reports'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Overall Reports</h1><div class="cards"><div class="card" th:each="e:${report}"><span th:text="${e.key}"></span><b th:text="${e.value}"></b></div></div><div class="panel"><h2>Completion</h2><div class="progress"><div th:style="'width:'+${progress}+'%'" th:text="${progress+'%'}"></div></div></div></main></div><script src="/js/app.js"></script></body></html>
