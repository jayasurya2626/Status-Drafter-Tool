<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'User Management'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>User Management</h1><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="panel"><h2>Update User</h2><form class="form-grid" method="post" action="/admin/users"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>User ID (for edit)<input name="id" type="number"></label><label>Name<input name="name" required></label><label>Username<input name="username" required></label><label>Email<input type="email" name="email" required></label><label>Password (required for new user)<input type="password" name="password" minlength="8"></label><label>Role<select name="role"><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select></label><label>Active<select name="active"><option value="true">Active</option><option value="false">Inactive</option></select></label><div class="full"><button class="primary">Update User</button></div></form><p>Enter an existing User ID. Registration is the supported way to create employee accounts.</p></div><div class="panel"><table><tr><th>ID</th><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Active</th><th>Action</th></tr><tr th:each="u:${users}"><td th:text="${u.id}"></td><td th:text="${u.name}"></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td th:text="${u.active}"></td><td><form th:action="@{'/admin/users/delete/'+${u.id}}" method="post" onsubmit="return confirmDelete()"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger small">Delete</button></form></td></tr></table></div></main></div><script src="/js/app.js"></script></body></html>
