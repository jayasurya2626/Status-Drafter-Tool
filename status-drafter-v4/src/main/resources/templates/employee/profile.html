<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Profile'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Profile</h1><form class="panel form-grid" th:action="@{/employee/profile}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Name<input name="name" th:value="${user.name}" required></label><label>Username<input th:value="${user.username}" disabled></label><label>Email<input type="email" name="email" th:value="${user.email}" required></label><label>Role<input th:value="${user.role}" disabled></label><div class="full"><button class="primary">Update Profile</button></div></form></main></div><script src="/js/app.js"></script></body></html>
