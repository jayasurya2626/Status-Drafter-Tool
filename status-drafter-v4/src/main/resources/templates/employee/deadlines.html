<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Deadlines'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Deadlines</h1><div class="grid2"><section class="panel"><h2>Upcoming (7 days)</h2><table><tr><th>Task</th><th>Deadline</th><th>Status</th></tr><tr th:each="t:${upcoming}"><td th:text="${t.taskName}"></td><td th:text="${t.deadline}"></td><td th:text="${t.status}"></td></tr></table></section><section class="panel"><h2>Overdue</h2><table><tr><th>Task</th><th>Due</th></tr><tr th:each="t:${overdue}"><td th:text="${t.taskName}"></td><td th:text="${t.deadline}"></td></tr></table></section></div></main></div><script src="/js/app.js"></script></body></html>
