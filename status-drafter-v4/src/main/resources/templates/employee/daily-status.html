<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Daily Status'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1 th:text="${status.id==null?'Daily Status Update':'Edit Status Update'}"></h1><form class="panel" th:action="${status.id==null?'/employee/status':'/employee/status/edit/'+status.id}" th:object="${status}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Date<input type="date" th:field="*{updateDate}" required></label><label>Today's Completed Work<textarea th:field="*{completedWork}" rows="4"></textarea></label><label>Current/Ongoing Work<textarea th:field="*{currentWork}" rows="4"></textarea></label><label>Pending Work<textarea th:field="*{pendingWork}" rows="4"></textarea></label><label>Challenges / Blockers<textarea th:field="*{blockers}" rows="4"></textarea></label><label>Next Steps<textarea th:field="*{nextSteps}" rows="4"></textarea></label><button class="primary">Save Status</button></form></main></div><script src="/js/app.js"></script></body></html>
