<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Status Updates'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Employee Status Updates</h1><form class="panel filters" method="get"><select name="employeeId"><option value="">All employees</option><option th:each="e:${employees}" th:value="${e.id}" th:text="${e.name}"></option></select><button class="button">Filter</button></form><div class="panel" th:each="s:${updates}"><h2 th:text="${s.employee.name+' — '+s.updateDate}"></h2><p><b>Completed:</b></p><p class="pre" th:text="${s.completedWork}"></p><p><b>Current:</b></p><p class="pre" th:text="${s.currentWork}"></p><p><b>Pending:</b></p><p class="pre" th:text="${s.pendingWork}"></p><p><b>Blockers:</b></p><p class="pre" th:text="${s.blockers}"></p><p><b>Next Steps:</b></p><p class="pre" th:text="${s.nextSteps}"></p></div></main></div><script src="/js/app.js"></script></body></html>
