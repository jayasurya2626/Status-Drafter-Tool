<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Employee Tasks'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Employee Tasks</h1><form class="panel filters" method="get"><select name="employeeId"><option value="">All employees</option><option th:each="e:${employees}" th:value="${e.id}" th:text="${e.name}" th:selected="${selected==e.id}"></option></select><button class="button">View</button></form><div class="panel"><table><tr><th>Employee</th><th>Task</th><th>Project</th><th>Status</th><th>Priority</th><th>Deadline</th></tr><tr th:each="t:${tasks}"><td th:text="${t.employee.name}"></td><td th:text="${t.taskName}"></td><td th:text="${t.project}"></td><td th:text="${t.status}"></td><td th:text="${t.priority}"></td><td th:text="${t.deadline}"></td></tr></table></div></main></div><script src="/js/app.js"></script></body></html>
