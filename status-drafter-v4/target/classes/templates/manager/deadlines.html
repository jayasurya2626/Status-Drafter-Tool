<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Deadlines'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Overdue Deadlines</h1><div class="panel"><table><tr><th>Employee</th><th>Task</th><th>Project</th><th>Deadline</th><th>Status</th></tr><tr th:each="t:${overdue}"><td th:text="${t.employee.name}"></td><td th:text="${t.taskName}"></td><td th:text="${t.project}"></td><td th:text="${t.deadline}"></td><td th:text="${t.status}"></td></tr></table></div></main></div><script src="/js/app.js"></script></body></html>
