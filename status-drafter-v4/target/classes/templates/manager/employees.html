<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Employees'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Employees</h1><div class="panel"><table><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th></tr><tr th:each="e:${employees}"><td th:text="${e.name}"></td><td th:text="${e.username}"></td><td th:text="${e.email}"></td><td th:text="${e.role}"></td></tr></table></div></main></div><script src="/js/app.js"></script></body></html>
