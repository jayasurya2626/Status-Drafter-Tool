<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Manager Dashboard'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Manager Dashboard</h1><div class="cards"><div class="card" th:each="e:${report}"><span th:text="${e.key}"></span><b th:text="${e.value}"></b></div><div class="card"><span>Progress</span><b th:text="${progress+'%'}"></b></div></div><section class="panel"><h2>Overdue Work</h2><table><tr><th>Employee</th><th>Task</th><th>Due</th><th>Status</th></tr><tr th:each="t:${overdue}"><td th:text="${t.employee.name}"></td><td th:text="${t.taskName}"></td><td th:text="${t.deadline}"></td><td th:text="${t.status}"></td></tr></table></section></main></div><script src="/js/app.js"></script></body></html>
