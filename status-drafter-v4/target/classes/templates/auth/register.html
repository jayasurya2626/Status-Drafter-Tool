<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Register'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><div class="auth-card"><h1>Create Employee Account</h1><div th:if="${error}" class="alert error" th:text="${error}"></div><form th:action="@{/register}" th:object="${form}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Name<input th:field="*{name}" required><small th:errors="*{name}"></small></label><label>Username<input th:field="*{username}" required><small th:errors="*{username}"></small></label><label>Email<input type="email" th:field="*{email}" required><small th:errors="*{email}"></small></label><label>Password<input type="password" th:field="*{password}" minlength="8" required><small th:errors="*{password}"></small></label><button class="primary">Register</button></form><p><a href="/login">Back to login</a></p></div></main></div><script src="/js/app.js"></script></body></html>
