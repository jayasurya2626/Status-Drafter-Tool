<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Login'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><div class="auth-card"><h1>Status Drafter Tool</h1><h2>Login</h2><div th:if="${param.error}" class="alert error">Invalid username or password.</div><div th:if="${param.logout}" class="alert success">Logged out successfully.</div><div th:if="${param.registered}" class="alert success">Registration successful. Please login.</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username<input name="username" required autofocus></label><label>Password<input type="password" name="password" required></label><button class="primary" type="submit">Login</button></form><p>New user? <a href="/register">Register</a></p></div></main></div><script src="/js/app.js"></script></body></html>
