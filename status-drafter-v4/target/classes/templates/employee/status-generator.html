<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Status Draft Generator'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Status Draft Generator</h1><form class="panel" method="post" action="/employee/status-generator/generate"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Date<input type="date" name="date" th:value="${generated.updateDate}" required></label><h3>Select tasks (leave all unchecked to use all tasks)</h3><div class="task-picks"><label th:each="t:${tasks}" class="pick"><input type="checkbox" name="taskIds" th:value="${t.id}"> <span th:text="${t.taskName+' — '+t.status}"></span></label></div><button class="primary">Generate from Selected Tasks</button></form><div class="panel"><h2>Preview / Edit</h2><form action="/employee/status-generator/save" method="post" th:object="${generated}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:value="${generated.id}"><label>Date<input type="date" name="updateDate" th:value="${generated.updateDate}" required></label><label>Today's Completed Work<textarea name="completedWork" rows="5" th:text="${generated.completedWork}"></textarea></label><label>Current Work<textarea name="currentWork" rows="5" th:text="${generated.currentWork}"></textarea></label><label>Pending Tasks<textarea name="pendingWork" rows="5" th:text="${generated.pendingWork}"></textarea></label><label>Blockers<textarea name="blockers" rows="5" th:text="${generated.blockers}"></textarea></label><label>Next Steps<textarea name="nextSteps" rows="5" th:text="${generated.nextSteps}"></textarea></label><button class="primary">Save Generated Status</button></form></div></main></div><script src="/js/app.js"></script></body></html>
