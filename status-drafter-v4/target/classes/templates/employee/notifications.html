<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Notifications'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Notifications</h1><div class="panel"><div class="notification" th:each="n:${notifications}" th:classappend="${n.readStatus?' read':''}"><div><b th:text="${n.type}"></b> <span th:text="${n.message}"></span><small th:text="${n.createdAt}"></small></div><form th:if="${!n.readStatus}" th:action="@{'/employee/notifications/read/'+${n.id}}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button small">Mark read</button></form></div><p th:if="${#lists.isEmpty(notifications)}">No notifications.</p></div></main></div><script src="/js/app.js"></script></body></html>
