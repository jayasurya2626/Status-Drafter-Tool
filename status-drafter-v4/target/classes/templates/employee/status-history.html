<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Status History'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><div class="page-head"><h1>Status History</h1><form method="get"><input type="date" name="date"><button class="button">Filter</button></form></div><div class="panel" th:each="s:${statuses}"><div class="page-head"><h2 th:text="${s.updateDate}"></h2><div><a class="button small" th:href="@{'/employee/status/edit/'+${s.id}}">Edit</a><form class="inline" th:action="@{'/employee/status/delete/'+${s.id}}" method="post" onsubmit="return confirmDelete()"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger small">Delete</button></form></div></div><h3>Completed</h3><p class="pre" th:text="${s.completedWork}"></p><h3>Current</h3><p class="pre" th:text="${s.currentWork}"></p><h3>Pending</h3><p class="pre" th:text="${s.pendingWork}"></p><h3>Blockers</h3><p class="pre" th:text="${s.blockers}"></p><h3>Next Steps</h3><p class="pre" th:text="${s.nextSteps}"></p></div><div class="panel" th:if="${#lists.isEmpty(statuses)}">No status updates found.</div></main></div><script src="/js/app.js"></script></body></html>
