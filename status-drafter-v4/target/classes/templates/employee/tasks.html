<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'My Tasks'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><div class="page-head"><h1>My Tasks</h1><a class="button primary" href="/employee/tasks/add">+ Add Task</a></div><form class="filters panel" method="get"><input name="name" placeholder="Task name" th:value="${param.name}"><input name="project" placeholder="Project" th:value="${param.project}"><select name="status"><option value="">All statuses</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select><select name="priority"><option value="">All priorities</option><option th:each="p:${priorities}" th:value="${p}" th:text="${p}"></option></select><input type="date" name="from"><input type="date" name="to"><button class="button">Search / Filter</button><a class="button" href="/employee/tasks">Clear</a></form><div class="panel"><table><tr><th>Task</th><th>Project</th><th>Priority</th><th>Status</th><th>Deadline</th><th>Actions</th></tr><tr th:each="t:${tasks}"><td><a th:href="@{'/employee/tasks/'+${t.id}}" th:text="${t.taskName}"></a></td><td th:text="${t.project}"></td><td th:text="${t.priority}"></td><td><span class="badge" th:text="${t.status}"></span></td><td th:text="${t.deadline}"></td><td><a class="button small" th:href="@{'/employee/tasks/edit/'+${t.id}}">Edit</a><form class="inline" th:action="@{'/employee/tasks/delete/'+${t.id}}" method="post" onsubmit="return confirmDelete()"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger small">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(tasks)}"><td colspan="6">No tasks found.</td></tr></table></div></main></div><script src="/js/app.js"></script></body></html>
