<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Employee Dashboard'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Employee Dashboard</h1><div class="cards"><div class="card"><span>Total Tasks</span><b th:text="${total}"></b></div><div class="card"><span>Completed</span><b th:text="${completed}"></b></div><div class="card"><span>In Progress</span><b th:text="${in_progress}"></b></div><div class="card"><span>Blocked</span><b th:text="${blocked}"></b></div><div class="card"><span>Overdue</span><b th:text="${overdue}"></b></div><div class="card"><span>Progress</span><b th:text="${progress+'%'}"></b></div></div><div class="grid2"><section class="panel"><h2>Recent Tasks</h2><table><tr><th>Task</th><th>Status</th><th>Deadline</th></tr><tr th:each="t:${recentTasks}"><td><a th:href="@{'/employee/tasks/'+${t.id}}" th:text="${t.taskName}"></a></td><td><span class="badge" th:text="${t.status}"></span></td><td th:text="${t.deadline}"></td></tr></table></section><section class="panel"><h2>Upcoming Deadlines</h2><ul class="clean"><li th:each="t:${upcoming}" th:text="${t.taskName+' — '+t.deadline}"></li><li th:if="${#lists.isEmpty(upcoming)}">No upcoming deadlines.</li></ul></section></div><section class="panel"><h2>Recent Status Updates</h2><table><tr><th>Date</th><th>Current Work</th></tr><tr th:each="s:${recentStatuses}"><td th:text="${s.updateDate}"></td><td class="pre" th:text="${s.currentWork}"></td></tr></table></section></main></div><script src="/js/app.js"></script></body></html>
