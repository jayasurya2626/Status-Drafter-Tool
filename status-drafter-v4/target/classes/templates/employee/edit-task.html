<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Edit Task'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><h1>Edit Task</h1><form class="panel form-grid" th:action="@{'/employee/tasks/edit/'+${task.id}}" th:object="${task}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{id}"><label>Task Name<input th:field="*{taskName}" required></label><label>Project<input th:field="*{project}" required></label><label>Priority<select th:field="*{priority}"><option th:each="p:${T(com.example.statusdrafter.entity.Task.Priority).values()}" th:value="${p}" th:text="${p}"></option></select></label><label>Status<select th:field="*{status}"><option th:each="s:${T(com.example.statusdrafter.entity.Task.Status).values()}" th:value="${s}" th:text="${s}"></option></select></label><label>Start Date<input type="date" th:field="*{startDate}" required></label><label>Deadline<input type="date" th:field="*{deadline}" required></label><label class="full">Description<textarea th:field="*{description}" rows="5"></textarea></label><button class="primary">Save Changes</button></form></main></div><script src="/js/app.js"></script></body></html>
