<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Task Details'">Status Drafter</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div class="app"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div th:if="${param.created}" class="alert success">Created successfully.</div><div th:if="${param.updated}" class="alert success">Updated successfully.</div><div th:if="${param.deleted}" class="alert success">Deleted successfully.</div><div th:if="${param.saved}" class="alert success">Saved successfully.</div><div class="page-head"><h1 th:text="${task.taskName}"></h1><a class="button" th:href="@{'/employee/tasks/edit/'+${task.id}}">Edit</a></div><div class="panel details"><p><b>Project:</b> <span th:text="${task.project}"></span></p><p><b>Status:</b> <span th:text="${task.status}"></span></p><p><b>Priority:</b> <span th:text="${task.priority}"></span></p><p><b>Start:</b> <span th:text="${task.startDate}"></span> <b>Deadline:</b> <span th:text="${task.deadline}"></span></p><h3>Description</h3><p class="pre" th:text="${task.description}"></p></div></main></div><script src="/js/app.js"></script></body></html>
